name: jlpt_jonggack
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.8.0+19 # Android Plus = +5 , Nomal = +8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
  flutter_svg:
  hive:
  hive_flutter:
  animate_do:
  flutter_slidable:
  flutter_animation_progress_bar:
  file_picker:
  flutter_tts:
  table_calendar:
  excel:
  # tutorial_coach_mark:
  google_mobile_ads:
  url_launcher:
  change_app_package_name:
  kanji_drawing_animation:
  flutter_spinkit:
  font_awesome_flutter:
  carousel_slider:
  flutter_local_notifications: ^17.0.0
  device_info_plus:
  in_app_review: ^2.0.9
  flutter_widget_from_html_core:
  animated_text_kit:
  confetti:
  auto_size_text:
  flutter_email_sender:
  toggle_switch:
  intl:
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  dropdown_button2: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.3.3
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/sounds/speech_to_text_cancel.m4r
    - assets/sounds/speech_to_text_listening.m4r
    - assets/sounds/speech_to_text_stop.m4r

  fonts:
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/NotoSerifJP-Light.otf
          weight: 300
        - asset: assets/fonts/NotoSerifJP-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSerifJP-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSerifJP-SemiBold.otf
          weight: 700
        - asset: assets/fonts/NotoSerifJP-Bold.otf
          weight: 800
        - asset: assets/fonts/NotoSerifJP-Black.otf
          weight: 900

    - family: ScoreStd
      fonts:
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600

    - family: GMarket
      fonts:
        - asset: assets/fonts/GmarketSansTTFMedium.ttf
        - asset: assets/fonts/GmarketSansTTFMedium.ttf
          weight: 300
        - asset: assets/fonts/GmarketSansTTFLight.ttf
          weight: 500
        - asset: assets/fonts/GmarketSansTTFBold.ttf
          weight: 700
